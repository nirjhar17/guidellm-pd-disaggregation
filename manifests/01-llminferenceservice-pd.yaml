apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen3-0-6b
  namespace: my-first-model
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    security.opendatahub.io/enable-auth: "false"
spec:
  model:
    name: Qwen/Qwen3-0.6B
    uri: hf://Qwen/Qwen3-0.6B

  # ── Decode pods (spec.replicas + spec.template) ──
  replicas: 2
  template:
    containers:
    - name: main
      image: vllm/vllm-openai:v0.11.2
      env:
      - name: VLLM_USE_V1
        value: "0"
      - name: HF_HOME
        value: /tmp/hf_home
      - name: VLLM_ADDITIONAL_ARGS
        value: >-
          --dtype=half
          --max-model-len=2048
          --max-num-seqs=64
          --gpu-memory-utilization=0.40
          --enforce-eager
          --enable-auto-tool-choice
          --tool-call-parser hermes
      - name: VLLM_CHAT_TEMPLATE_ENABLE_THINKING
        value: "false"
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "2"
          memory: 6Gi
          nvidia.com/gpu: "1"       # MUST equal request
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

  # ── Prefill pods (spec.prefill) ──
  prefill:
    replicas: 2
    template:
      containers:
      - name: main
        image: vllm/vllm-openai:v0.11.2
        env:
        - name: VLLM_USE_V1
          value: "0"
        - name: HF_HOME
          value: /tmp/hf_home
        - name: VLLM_ADDITIONAL_ARGS
          value: >-
            --dtype=half
            --max-model-len=2048
            --max-num-seqs=64
            --gpu-memory-utilization=0.40
            --enforce-eager
            --enable-auto-tool-choice
            --tool-call-parser hermes
        - name: VLLM_CHAT_TEMPLATE_ENABLE_THINKING
          value: "false"
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: 6Gi
            nvidia.com/gpu: "1"     # MUST equal request
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

  # ── Router / Scheduler ──
  router:
    gateway: {}
    route: {}
    scheduler:
      template:
        containers:
        - name: main
          args:
          - --pool-group
          - inference.networking.x-k8s.io
          - --pool-name
          - "{{ ChildName .ObjectMeta.Name `-inference-pool` }}"
          - --pool-namespace
          - "{{ .ObjectMeta.Namespace }}"
          - --config-text
          - |
            apiVersion: inference.networking.x-k8s.io/v1alpha1
            kind: EndpointPickerConfig
            plugins:
            - type: queue-scorer
            - type: kv-cache-utilization-scorer
            - type: prefix-cache-scorer
            schedulingProfiles:
            - name: default
              plugins:
              - pluginRef: queue-scorer
                weight: 2
              - pluginRef: kv-cache-utilization-scorer
                weight: 2
              - pluginRef: prefix-cache-scorer
                weight: 3
          env:
          - name: TOKENIZER_CACHE_DIR
            value: /tmp/tokenizer-cache
          - name: HF_HOME
            value: /tmp/tokenizer-cache
          volumeMounts:
          - name: tokenizer-cache
            mountPath: /tmp/tokenizer-cache
        volumes:
        - name: tokenizer-cache
          emptyDir: {}
