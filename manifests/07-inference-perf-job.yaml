apiVersion: batch/v1
kind: Job
metadata:
  name: inference-perf-shared-prefix
  namespace: guidellm-lab
  labels:
    app: inference-perf
spec:
  template:
    metadata:
      labels:
        app: inference-perf
    spec:
      containers:
      - name: inference-perf
        image: quay.io/inference-perf/inference-perf:latest
        imagePullPolicy: Always
        command: ["inference-perf"]
        args: ["--config_file", "/etc/config/06-inference-perf-shared-prefix-config.yml"]
        env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp/hf_home
        - name: TRANSFORMERS_CACHE
          value: /tmp/hf_home
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
      restartPolicy: Never
      volumes:
      - name: config-volume
        configMap:
          name: inference-perf-config
