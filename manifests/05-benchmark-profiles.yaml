# All 7 GuideLLM benchmark Jobs -- one per load profile
# Target: EPP Gateway (goes through llm-d intelligent routing)
# PVC: guidellm-results-pvc in guidellm-lab namespace
# Run one at a time: oc apply -f <this-file> won't work (duplicate names)
# Instead, use: oc apply -f <this-file> with yq to select individual docs

---
# 1. SYNCHRONOUS -- one request at a time (baseline)
apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-profile-synchronous
  namespace: guidellm-lab
spec:
  template:
    spec:
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.5.0
        env:
        - name: HOME
          value: /results
        command: ["guidellm"]
        args:
        - "benchmark"
        - "run"
        - "--target"
        - "http://aed7822c4ec88495fa795e5c47c2d24f-1452512295.ap-southeast-1.elb.amazonaws.com/my-first-model/qwen3-0-6b"
        - "--model"
        - "Qwen/Qwen3-0.6B"
        - "--data"
        - '{"prompt_tokens":256,"output_tokens":128}'
        - "--profile"
        - "synchronous"
        - "--max-seconds"
        - "60"
        - "--output-dir"
        - "/results"
        - "--outputs"
        - "sync-benchmarks.json,sync-benchmarks.html"
        volumeMounts:
        - name: results
          mountPath: /results
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: guidellm-results-pvc
      restartPolicy: Never
  backoffLimit: 1

