load:
  type: constant
  stages:
  - rate: 1
    duration: 30
  - rate: 3
    duration: 30
  - rate: 5
    duration: 30
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: Qwen/Qwen3-0.6B
  base_url: http://aed7822c4ec88495fa795e5c47c2d24f-1452512295.ap-southeast-1.elb.amazonaws.com/my-first-model/qwen3-0-6b
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen3-0.6B
data:
  type: shared_prefix
  shared_prefix:
    num_unique_system_prompts: 5
    num_users_per_system_prompt: 20
    system_prompt_len: 128
    question_len: 64
    output_len: 64
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
